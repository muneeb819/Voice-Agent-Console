# Publish only the browser demo. The Node/WebSocket backend needs a separate host.
name: Deploy static console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      asset_version: ${{ steps.version.outputs.asset_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify static mirror
        run: |
          node tools/sync-static-site.js
          git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard -- docs)"

      - name: Read asset version
        id: version
        run: echo "asset_version=$(node -p 'require("./public/version.json").build')" >> "$GITHUB_OUTPUT"

      - name: Upload only public browser assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish demo link summary
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          ASSET_VERSION: ${{ needs.build.outputs.asset_version }}
        run: |
          set -euo pipefail
          {
            echo "## Static demo published"
            echo
            echo "- Demo link: ${SITE_URL}"
            echo "- Asset build: ${ASSET_VERSION}"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Scope: browser-only static demo; no Node API, WebSocket backend, or VICIdial bridge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published console and login assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          ASSET_VERSION: ${{ needs.build.outputs.asset_version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "${SITE_URL}version.json?run=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/version.json"
          node -e 'const fs = require("fs"); if (JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/version.json", "utf8")).build !== process.env.ASSET_VERSION) process.exit(1)'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}login.js?v=${ASSET_VERSION}" -o "$RUNNER_TEMP/login.js"
          node --check "$RUNNER_TEMP/login.js"
          grep -F 'var rawPath' "$RUNNER_TEMP/login.js"
          grep -F 'parsed.origin === location.origin' "$RUNNER_TEMP/login.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}app.js?v=${ASSET_VERSION}" -o "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
          grep -F "const VAC_CLOUD_SESSION_KEY = 'vac_cloud_session_v1'" "$RUNNER_TEMP/app.js"
          grep -F 'data-campaign-agent' "$RUNNER_TEMP/app.js"
          grep -F 'Save not confirmed' "$RUNNER_TEMP/app.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}brand-logos.js?v=${ASSET_VERSION}" -o "$RUNNER_TEMP/brand-logos.js"
          node --check "$RUNNER_TEMP/brand-logos.js"
          grep -F 'THEME_LOGO_MAP' "$RUNNER_TEMP/brand-logos.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}assets/brand/mma-gold-ember-icon.jpg" -o /dev/null
          curl --fail --silent --show-error --location "${SITE_URL}login.html?v=${ASSET_VERSION}" | grep -F 'id="signup-form"'
          curl --fail --silent --show-error --location "${SITE_URL}index.html?v=${ASSET_VERSION}" | grep -F "CURRENT_BUILD = '${ASSET_VERSION}'"
