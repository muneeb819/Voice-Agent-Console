name: Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.5.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run automated test suite
        run: npm test
        env:
          CI: 'true'

      - name: Audit dependency tree
        run: npm audit --audit-level=high

  speech-service:
    name: Speech service CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: speech-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: speech-service/requirements-test.txt
      - name: Install CPU test dependencies
        run: pip install -r requirements-test.txt
      - name: Run speech-service regression tests
        run: python -m pytest -q
